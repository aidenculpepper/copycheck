<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CopyCheck share image</title>
<link rel="stylesheet" href="banner.css">
<script src="banner.js" defer></script>
</head>
<body>
<div class="banner">
  <div class="banner-copy">
    <p class="banner-eyebrow">Windows 10 and 11 &middot; Tray app</p>
    <h1 class="banner-title"><img class="banner-icon" src="../../temp/social/app-icon.png" alt="">CopyCheck</h1>
    <p class="banner-sub">A small checkmark next to your selection when Ctrl+C really copied.</p>
    <div class="copy-demo">
      <span class="copy-line">Copy this <span class="copy-selected">order number: 48213</span></span>
      <!-- Same path, color and stroke as the overlay in CopyCheck.cs (CheckOverlay.Render). -->
      <svg class="copy-check" viewBox="0 0 22 22" aria-hidden="true"><polyline points="4,11 9,16 18,6"/></svg>
    </div>
    <p class="banner-url">github.com/aidenculpepper/copycheck</p>
  </div>
  <div class="banner-art">
    <img class="settings-shot" src="../../temp/social/settings-window.png" alt="CopyCheck settings window">
  </div>
</div>
</body>
</html>
